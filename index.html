<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./styles.css">

  <title>Frontend Mentor | Results summary component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution {
      font-size: 0.6875rem;
      text-align: center;
      display: none;
    }

    .attribution a {
      display: none;
    }
  </style>
</head>

<body>
  <main class="results-container">
    <div class="results-top">
      <p class="your-result">Your Result</p>
      <div class="rank">
        <h1>76</h1>
        <p class="of">of 100</p>
      </div>
      <h2>Great</h2>
      <p class="placement">You scored higher than 65% of the people who have taken these tests.</p>
    </div>
    <div class="results-bottom">
      <h3>Summary</h3>
      <div class="stats">
        <div class="stat-container" id="reaction">
          <div class="category">
            <img alt="reaction-icon" class="icon" src="./assets/images/icon-reaction.svg" />
            <h4>Reaction</h4>
          </div>
          <div class="score">
            <span><strong>80</strong> / 100</span>
          </div>
        </div>
        <div class="stat-container" id="memory">
          <div class="category">
            <img alt="memory-icon" class="icon" src="./assets/images/icon-memory.svg" />
            <h4>Memory</h4>
          </div>
          <div class="score">
            <span><strong>92</strong> / 100</span>
          </div>
        </div>
        <div class="stat-container" id="verbal">
          <div class="category">
            <img alt="verbal-icon" class="icon" src="./assets/images/icon-verbal.svg" />
            <h4>Verbal</h4>
          </div>
          <div class="score">
            <span><strong>61</strong> / 100</span>
          </div>
        </div>
        <div class="stat-container" id="visual">
          <div class="category">
            <img alt="visual-icon" class="icon" src="./assets/images/icon-visual.svg" />
            <h4>Visual</h4>
          </div>
          <div class="score">
            <span><strong>73</strong> / 100</span>
          </div>
        </div>
      </div>
      <button type="button">
        Continue
      </button>
    </div>
  </main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>

</html>
